name: Update KSÍ games

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download KSÍ fixtures and officials
        run: |
          python <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta

          endpoint = "https://www.abler.io/comet-backend/graphql"

          today = datetime.now(timezone.utc).date()
          start_date = today
          end_date = today + timedelta(days=6)

          date_from = f"{start_date.isoformat()}T00:00:00.000+00:00"
          date_to = f"{end_date.isoformat()}T23:59:59.999+00:00"

          fixtures_query = """
          query CometMatches(
            $first: Int!,
            $after: String,
            $filter: CometMatchFilterInput,
            $sort: CometMatchSort
          ) {
            cometMatches(
              first: $first,
              after: $after,
              filter: $filter,
              sort: $sort
            ) {
              totalCount
              edges {
                node {
                  matchId
                  matchDescription
                  matchDate
                  liveStatus
                  matchStatus
                  homeScore
                  awayScore
                  facilityName

                  competition {
                    name
                    category
                    gender
                    competitionType
                  }

                  homeTeam {
                    name
                    logo
                  }

                  awayTeam {
                    name
                    logo
                  }
                }
              }
            }
          }
          """

          officials_query = """
          query MatchesOfficials($matchIds: [Int!]!) {
            matchesOfficials(matchIds: $matchIds) {
              matchId
              officials {
                personId
                name
                role
                orderNumber
              }
            }
          }
          """

          def send_graphql_request(payload):
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "robocop-dashboard"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)

              if result.get("errors"):
                  raise RuntimeError(
                      "GraphQL error: "
                      + json.dumps(result["errors"], ensure_ascii=False)
                  )

              return result

          fixtures_payload = {
              "operationName": "CometMatches",
              "variables": {
                  "first": 100,
                  "filter": {
                      "categories": ["Adults"],
                      "dateFrom": date_from,
                      "dateTo": date_to
                  },
                  "sort": "NEXT_FIRST"
              },
              "query": fixtures_query
          }

          fixtures_result = send_graphql_request(fixtures_payload)

          edges = (
              fixtures_result
              .get("data", {})
              .get("cometMatches", {})
              .get("edges", [])
          )

          allowed_competitions = (
              "Besta deild karla",
              "Lengjudeild karla",
              "2. deild karla",
              "3. deild karla",
              "4. deild karla",
              "Mjólkurbikar karla",
              "Deildabikar karla"
          )

          filtered_matches = []

          for edge in edges:
              match = edge.get("node") or {}
              competition = match.get("competition") or {}
              competition_name = competition.get("name", "")

              if competition.get("category") != "Adults":
                  continue

              if competition.get("gender") != "Male":
                  continue

              if not any(
                  allowed in competition_name
                  for allowed in allowed_competitions
              ):
                  continue

              filtered_matches.append(match)

          match_ids = [
              match.get("matchId")
              for match in filtered_matches
              if match.get("matchId") is not None
          ]

          officials_by_match = {}

          if match_ids:
              officials_payload = {
                  "operationName": "MatchesOfficials",
                  "variables": {
                      "matchIds": match_ids
                  },
                  "query": officials_query
              }

              officials_result = send_graphql_request(
                  officials_payload
              )

              officials_matches = (
                  officials_result
                  .get("data", {})
                  .get("matchesOfficials", [])
              )

              for match_officials in officials_matches:
                  match_id = match_officials.get("matchId")

                  officials = sorted(
                      match_officials.get("officials") or [],
                      key=lambda official: (
                          official.get("orderNumber")
                          if official.get("orderNumber") is not None
                          else 999
                      )
                  )

                  officials_by_match[match_id] = [
                      {
                          "personId": official.get("personId"),
                          "name": official.get("name"),
                          "role": official.get("role"),
                          "orderNumber": official.get("orderNumber")
                      }
                      for official in officials
                  ]

          games = []

          for match in filtered_matches:
              competition = match.get("competition") or {}
              home_team = match.get("homeTeam") or {}
              away_team = match.get("awayTeam") or {}
              match_id = match.get("matchId")

              games.append({
                  "id": match_id,
                  "date": match.get("matchDate"),
                  "competition": competition.get("name"),
                  "home": home_team.get("name"),
                  "away": away_team.get("name"),
                  "homeLogo": home_team.get("logo"),
                  "awayLogo": away_team.get("logo"),
                  "facility": match.get("facilityName"),
                  "status": match.get("matchStatus"),
                  "liveStatus": match.get("liveStatus"),
                  "homeScore": match.get("homeScore"),
                  "awayScore": match.get("awayScore"),
                  "officials": officials_by_match.get(match_id, [])
              })

          games.sort(
              key=lambda game: game.get("date") or ""
          )

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "date": today.isoformat(),
              "dateFrom": start_date.isoformat(),
              "dateTo": end_date.isoformat(),
              "games": games
          }

          with open("fixtures.json", "w", encoding="utf-8") as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          officials_count = sum(
              len(game["officials"])
              for game in games
          )

          print(
              f"Saved {len(games)} matches and "
              f"{officials_count} officials to fixtures.json"
          )
          PY

      - name: Commit updated games
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fixtures.json

          if git diff --cached --quiet; then
            echo "No fixture changes"
          else
            git commit -m "Update KSÍ fixtures"
          git pull --rebase origin main
          git push origin main
          fi
          
